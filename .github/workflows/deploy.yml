name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify Web3Forms access key is configured
        env:
          ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
        run: |
          if [ -z "$ACCESS_KEY" ]; then
            echo "ERROR: NEXT_PUBLIC_WEB3FORMS_KEY secret is empty or missing."
            echo "Sign up at web3forms.com to get a key, then set it in repo"
            echo "Settings -> Secrets and variables -> Actions before deploying."
            echo "Failing the build to prevent shipping a site with a broken contact form."
            exit 1
          fi
          echo "Web3Forms access key is configured."

      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
