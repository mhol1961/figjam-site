name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify webhook URL secret is configured
        env:
          WEBHOOK_URL: ${{ secrets.NEXT_PUBLIC_GHL_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "ERROR: NEXT_PUBLIC_GHL_WEBHOOK_URL secret is empty or missing."
            echo "Set it in repo Settings -> Secrets and variables -> Actions before deploying."
            echo "Failing the build to prevent shipping a site with a broken contact form."
            exit 1
          fi
          echo "Webhook URL secret is configured."

      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_GHL_WEBHOOK_URL: ${{ secrets.NEXT_PUBLIC_GHL_WEBHOOK_URL }}

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
